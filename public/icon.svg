<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Circuit Pattern -->
  <path d="M64 256 H180 L220 180 H320" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.25" fill="none" />
  <path d="M220 332 H300 L340 256 H448" stroke="#818cf8" stroke-width="6" stroke-opacity="0.25" fill="none" />
  <!-- Core Ring -->
  <circle cx="256" cy="256" r="140" stroke="url(#cyanGlow)" stroke-width="12" fill="#0f172a" fill-opacity="0.8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="110" stroke="#38bdf8" stroke-dasharray="12 12" stroke-width="4" stroke-opacity="0.6" fill="none" />
  <!-- Math Exponent Symbol x^n -->
  <text x="210" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="900" fill="#ffffff" text-anchor="middle">X</text>
  <text x="315" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="900" fill="#38bdf8" text-anchor="middle">n</text>
  <!-- Small Energy Spark -->
  <polygon points="256,150 262,170 282,176 262,182 256,202 250,182 230,176 250,170" fill="#facc15" />
</svg>
